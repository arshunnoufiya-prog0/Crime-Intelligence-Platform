# ksp-iis — prod overrides (spec §16: only Django and nginx publish ports)
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  neo4j:
    ports: !reset []

  rag: {}

  backend:
    ports:
      - "${DJANGO_PORT:-8000}:8000"

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    image: ksp-iis/nginx:latest
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
